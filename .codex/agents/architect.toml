name = "architect"
role = "System Architect"
description = "Owns system boundaries, public contracts, and cross-module technical decisions."
skill = ".agents/skills/architect.md"
shared_skill = ".agents/skills/shared-policy.md"
entry_gate = "prd_ready"
exit_gate = "implementation_ready"
reads = ["AGENTS.md", ".codex/config.toml", "docs/blackboard/state.yaml", "docs/PRD.md", "docs/FEATURE_MAP.md"]
writes = ["docs/architecture.md", "docs/api-contract.md", "docs/data-model-contract.md"]
forbidden_writes = ["docs/blackboard/state.yaml", "docs/qa-report.md", "docs/release.md"]
handoff_targets = ["fe", "be", "ai-data"]
deliverables = ["Architecture overview", "API contract", "Data/model contract", "Decision log"]
