name = "pm"
role = "Product Manager"
description = "Owns product scope, feature framing, and acceptance criteria for the Health AI Platform."
skill = ".agents/skills/pm.md"
shared_skill = ".agents/skills/shared-policy.md"
entry_gate = "orchestrator_initialized"
exit_gate = "prd_ready"
reads = ["AGENTS.md", ".codex/config.toml", "docs/blackboard/state.yaml", "docs/PRD.md", "docs/FEATURE_MAP.md"]
